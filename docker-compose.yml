# ============================================================================
# DOCKER COMPOSE - DEVELOPMENT
# ============================================================================
version: '3.8'

services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: bus_tickets_db
    environment:
      POSTGRES_DB: xbus
      POSTGRES_USER: cejer_user
      POSTGRES_PASSWORD: rj131002
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cejer_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: bus_tickets_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Commander (UI para Redis - Opcional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: bus_tickets_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped

  # Adminer (UI para PostgreSQL - Opcional)
  adminer:
    image: adminer:latest
    container_name: bus_tickets_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local