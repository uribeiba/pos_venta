# ============================================================================
# REDIS CONFIGURATION - DEVELOPMENT
# ============================================================================

# Bind a localhost solo (seguridad)
bind 127.0.0.1
port 6379

# Persistencia
save 900 1
save 300 10
save 60 10000

# Seguridad
requirepass  # Sin contraseña en desarrollo

# Límites
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile /dev/stdout

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511