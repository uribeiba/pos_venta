{% extends 'coordinator/base.html' %}
{% load static %}
{% block title %}{% if is_new %}Nuevo mecánico{% else %}Editar mecánico{% endif %}{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-3">
    <div class="d-flex justify-content-between align-items-center mb-4 p-4 rounded-4" style="background:linear-gradient(115deg,#172554 0%,#1d4ed8 100%);color:#fff">
        <div>
            <div class="small text-uppercase fw-bold opacity-75">Taller</div>
            <h3 class="mb-0 fw-bold"><i class="fas fa-user-gear me-2"></i>{% if is_new %}Nuevo mecánico{% else %}Editar mecánico{% endif %}</h3>
        </div>
        <a href="{% url 'coordinator:workshop_mechanic_list' %}" class="btn btn-outline-light"><i class="fas fa-arrow-left me-1"></i>Volver</a>
    </div>
    <form method="post" class="card border-0 shadow-sm p-4">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label small fw-bold">Nombre *</label><input type="text" name="first_name" class="form-control" required value="{{ mechanic.first_name|default:'' }}"></div>
            <div class="col-md-6"><label class="form-label small fw-bold">Apellido *</label><input type="text" name="last_name" class="form-control" required value="{{ mechanic.last_name|default:'' }}"></div>
            <div class="col-md-6"><label class="form-label small fw-bold">RUT</label><input type="text" name="rut" class="form-control" value="{{ mechanic.rut|default:'' }}"></div>
            <div class="col-md-6"><label class="form-label small fw-bold">Teléfono</label><input type="text" name="phone" class="form-control" value="{{ mechanic.phone|default:'' }}"></div>
            <div class="col-md-6"><label class="form-label small fw-bold">Email</label><input type="email" name="email" class="form-control" value="{{ mechanic.email|default:'' }}"></div>
            <div class="col-md-6"><label class="form-label small fw-bold">Rol *</label>
                <select name="role" class="form-select" required>
                    {% for value, label in role_choices %}
                    <option value="{{ value }}" {% if not is_new and mechanic.role == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6"><label class="form-label small fw-bold">Taller</label>
                <select name="workshop" class="form-select">
                    <option value="">—</option>
                    {% for w in workshops %}<option value="{{ w.id }}" {% if not is_new and mechanic.workshop_id == w.id %}selected{% endif %}>{{ w.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" {% if is_new or mechanic.is_active %}checked{% endif %}>
                    <label class="form-check-label">Activo</label>
                </div>
            </div>
        </div>
        <div class="mt-4"><button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Guardar</button></div>
    </form>
</div>
{% endblock %}
