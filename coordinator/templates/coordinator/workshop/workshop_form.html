{% extends 'coordinator/base.html' %}
{% load static %}
{% block title %}{% if is_new %}Nuevo taller{% else %}Editar taller{% endif %}{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-3">
    <div class="d-flex justify-content-between align-items-center mb-4 p-4 rounded-4" style="background:linear-gradient(115deg,#172554 0%,#1d4ed8 100%);color:#fff">
        <div>
            <div class="small text-uppercase fw-bold opacity-75">Taller</div>
            <h3 class="mb-0 fw-bold"><i class="fas fa-warehouse me-2"></i>{% if is_new %}Nuevo taller{% else %}Editar taller{% endif %}</h3>
        </div>
        <a href="{% url 'coordinator:workshop_list' %}" class="btn btn-outline-light">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </a>
    </div>
    <form method="post" class="card border-0 shadow-sm p-4">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label small fw-bold">Nombre *</label>
                <input type="text" name="name" class="form-control" required value="{{ workshop.name|default:'' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Código</label>
                <input type="text" name="code" class="form-control" value="{{ workshop.code|default:'' }}">
            </div>
            <div class="col-md-12">
                <label class="form-label small fw-bold">Dirección</label>
                <input type="text" name="address" class="form-control" value="{{ workshop.address|default:'' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">Teléfono</label>
                <input type="text" name="phone" class="form-control" value="{{ workshop.phone|default:'' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">Email</label>
                <input type="email" name="email" class="form-control" value="{{ workshop.email|default:'' }}">
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="form-check me-4">
                    <input type="checkbox" name="is_internal" class="form-check-input" {% if is_new or workshop.is_internal %}checked{% endif %}>
                    <label class="form-check-label">Taller interno</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" {% if is_new or workshop.is_active %}checked{% endif %}>
                    <label class="form-check-label">Activo</label>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>Guardar
            </button>
        </div>
    </form>
</div>
{% endblock %}
