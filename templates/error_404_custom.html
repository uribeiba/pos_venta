{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página no encontrada </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .error-card {
            width: 100%;
            max-width: 620px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, .10);
            padding: 50px 40px;
            text-align: center;
        }

        .error-icon {
            width: 90px;
            height: 90px;
            border-radius: 24px;
            background: #eff6ff;
            color: #2563eb;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .error-code {
            font-size: 5rem;
            line-height: 1;
            font-weight: 900;
            color: #0f172a;
            margin-top: 24px;
        }

        .error-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1e293b;
            margin-top: 10px;
        }

        .error-description {
            color: #64748b;
            max-width: 440px;
            margin: 12px auto 28px;
        }

        .btn-home {
            padding: 11px 22px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="error-card">

    <div class="error-icon">
        <i class="fas fa-route"></i>
    </div>

    <div class="error-code">
        404
    </div>

    <div class="error-title">
        Página no encontrada
    </div>

    <p class="error-description">
        La dirección que intentaste visitar no existe
        o pudo haber sido modificada.
    </p>

    {% if user.is_authenticated %}

        <a href="{% url 'coordinator:dashboard' %}"
           class="btn btn-primary btn-home">

            <i class="fas fa-arrow-left me-2"></i>
            Volver al Panel de Control

        </a>

    {% else %}

        <a href="{% url 'login' %}"
           class="btn btn-primary btn-home">

            <i class="fas fa-sign-in-alt me-2"></i>
            Ir al inicio de sesión

        </a>

    {% endif %}

</div>

</body>
</html>
