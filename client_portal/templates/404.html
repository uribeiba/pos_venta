<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Buses La Porteña</title>
    
    <!-- Bootstrap y FontAwesome para que se vea bonito sin depender de archivos locales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .error-container {
            max-width: 500px;
            padding: 20px;
        }

        .icon-circle {
            width: 100px;
            height: 100px;
            border: 3px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 40px;
            color: #000;
            background-color: #c4ff61; /* Verde lima */
            border-color: #c4ff61;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .error-text {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }

        .arrow-box {
            background-color: #c4ff61;
            color: #000;
            display: inline-block;
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 5px;
            margin-bottom: 20px;
            position: relative;
        }
        
        /* Triangulito del globo de texto */
        .arrow-box::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #c4ff61 transparent transparent transparent;
        }

        .btn-custom-primary {
            background-color: #c4ff61;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-custom-primary:hover {
            background-color: #b0ea4e;
            color: #000;
            transform: translateY(-2px);
        }

        .btn-custom-outline {
            background-color: transparent;
            color: #000;
            border: 2px solid #c4ff61;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-custom-outline:hover {
            background-color: #c4ff61;
            color: #000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <!-- Icono circular -->
        <div class="icon-circle">
            <i class="fa-solid fa-circle-info"></i>
        </div>

        <!-- Textos -->
        <h1 class="error-title">Oops!</h1>
        <p class="error-text">La página que buscas no existe... o ha desaparecido</p>

        <!-- Globo de texto -->
        <div class="arrow-box">
            ¡Intenta explorando otras secciones!
        </div>

        <!-- Botones -->
        <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="/" class="btn btn-custom-primary">
                Nueva Búsqueda
            </a>
            <a href="mailto:contacto@portena.online" class="btn btn-custom-outline">
                Contáctanos
            </a>
        </div>
    </div>

</body>
</html>
