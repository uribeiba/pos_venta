{% extends 'client_portal/base.html' %}

{% block content %}
<div class="container py-5 text-center">

    <div class="card shadow-sm border-0 mx-auto"
         style="max-width: 520px; border-radius: 20px;">

        <div class="card-body p-5">

            <div class="spinner-border text-warning mb-4"
                 role="status">
                <span class="visually-hidden">
                    Cargando...
                </span>
            </div>

            <h4 class="fw-bold">
                Redireccionando a Webpay
            </h4>

            <p class="text-muted">
                Reserva {{ order.code }}
            </p>

            <p class="small text-muted">
                Serás enviado al sitio seguro de Transbank.
            </p>

            <form id="webpayForm"
                  method="POST"
                  action="{{ webpay_url }}">

                <input type="hidden"
                       name="token_ws"
                       value="{{ token_ws }}">

                <button type="submit"
                        class="btn btn-warning fw-bold px-5">
                    CONTINUAR A WEBPAY
                </button>

            </form>

        </div>
    </div>
</div>

<script>
document.addEventListener(
    'DOMContentLoaded',
    function () {
        setTimeout(function () {
            document
                .getElementById('webpayForm')
                .submit();
        }, 1000);
    }
);
</script>
{% endblock %}
