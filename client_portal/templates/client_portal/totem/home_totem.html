{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tótem - {{ company_name }}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --primary: {{ primary_color }};
        }
        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none; /* Evita que se seleccione texto por accidente */
        }
        .header-totem {
            background-color: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid rgba(0,0,0,0.1);
        }
        .logo-totem {
            max-height: 100px;
            margin-bottom: 10px;
        }
        .header-totem h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .search-card-totem {
            background: white;
            border-radius: 30px;
            padding: 50px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        .form-label-totem {
            font-size: 1.8rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 15px;
        }
        .form-select-totem, .form-control-totem {
            font-size: 2rem;
            padding: 20px 30px;
            height: auto;
            border-radius: 15px;
            border: 3px solid #cbd5e1;
            background-color: #f8fafc;
            font-weight: 600;
            color: #1e293b;
        }
        .form-select-totem:focus, .form-control-totem:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(11, 59, 120, 0.25);
        }
        .btn-totem {
            background-color: var(--primary);
            color: white;
            font-size: 2.5rem;
            font-weight: 800;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            border: none;
            margin-top: 30px;
            transition: transform 0.1s;
        }
        .btn-totem:active {
            transform: scale(0.98);
        }
        /* Pantalla de reposo */
        #screen-saver {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }
        #screen-saver i {
            font-size: 8rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        #screen-saver h2 {
            font-size: 3.5rem;
            font-weight: 800;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de bloqueo inicial -->
    <div id="screen-saver" onclick="startTotem()">
        <i class="fa-solid fa-hand-pointer"></i>
        <h2>Toque la pantalla para comenzar</h2>
    </div>

    <!-- Cabecera -->
    <div class="header-totem">
        {% if company_logo %}
            <img src="{{ company_logo }}" alt="{{ company_name }}" class="logo-totem">
        {% else %}
            <h1>{{ company_name }}</h1>
        {% endif %}
        <p style="font-size: 1.5rem; margin-top: 10px; opacity: 0.9;">Bienvenido a la compra de pasajes</p>
    </div>

    <!-- Contenedor principal -->
    <div class="main-content">
        <div class="search-card-totem">
            <form action="{% url 'client_portal:search_trips' %}" method="GET">
                <div class="row g-4">
                    <!-- Origen -->
                    <div class="col-md-6">
                        <label class="form-label-totem">¿Desde dónde viajas?</label>
                        <select name="origin" class="form-select form-select-totem" required>
                            <option value="">Selecciona Origen</option>
                            {% for city in origin_cities %}
                                <option value="{{ city.name }}">{{ city.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <!-- Destino -->
                    <div class="col-md-6">
                        <label class="form-label-totem">¿A dónde vas?</label>
                        <select name="destination" class="form-select form-select-totem" required>
                            <option value="">Selecciona Destino</option>
                            {% for city in destination_cities %}
                                <option value="{{ city.name }}">{{ city.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Fecha -->
                    <div class="col-md-12">
                        <label class="form-label-totem">¿Cuándo viajas?</label>
                        <input type="date" name="date" class="form-control form-control-totem" required>
                    </div>
                </div>

                <button type="submit" class="btn-totem">
                    <i class="fa-solid fa-magnifying-glass me-3"></i> BUSCAR VIAJES
                </button>
            </form>
        </div>
    </div>

    <script>
        // Lógica del Protector de Pantalla (Kiosco)
        function startTotem() {
            document.getElementById('screen-saver').style.display = 'none';
            resetTimer();
        }

        let idleTimer;
        function resetTimer() {
            clearTimeout(idleTimer);
            // Si pasan 60 segundos sin tocar nada, vuelve a la pantalla de bloqueo
            idleTimer = setTimeout(() => {
                document.getElementById('screen-saver').style.display = 'flex';
                // Aquí podríamos recargar la página para limpiar datos:
                // window.location.reload();
            }, 60000); 
        }

        // Reiniciar el temporizador con cualquier toque
        document.body.addEventListener('touchstart', resetTimer);
        document.body.addEventListener('mousemove', resetTimer);
    </script>
</body>
</html>
